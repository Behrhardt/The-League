name: Deploy to GitHub Pages

# The site is plain static files, so there is nothing to build — this just
# uploads the repository and hands it to Pages.
#
# ONE-TIME SETUP: Settings -> Pages -> Source: "GitHub Actions".
# That has to be done by hand once. The Actions token is allowed to *deploy* to
# Pages but not to create the Pages site itself, so `enablement: true` here
# fails with "Resource not accessible by integration". Once the source is set,
# every push deploys automatically and nothing else is needed.

on:
  push:
    branches:
      - main
      - claude/league-landing-website-qjx3kb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
